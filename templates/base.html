<!doctype html>
<html lang="ru" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Screenly{% endblock %} · Screenly</title>
  <meta name="description" content="Screenly — ИИ-скрининг резюме: оценка кандидатов по требованиям вакансии на локальной модели.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366f1'/%3E%3Cstop offset='1' stop-color='%237c3aed'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M11 13h10M11 17h10M11 21h6' stroke='white' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        boxShadow: {
          card: '0 1px 2px rgba(15,23,42,.04), 0 1px 3px rgba(15,23,42,.06)',
          lift: '0 10px 30px -12px rgba(79,70,229,.25)',
        },
      } }
    }
  </script>
  <style type="text/tailwindcss">
    @layer components {
      .card { @apply rounded-2xl bg-white shadow-card ring-1 ring-slate-900/[.06]; }
      .btn { @apply inline-flex items-center justify-center gap-2 rounded-lg px-4 py-2 text-sm font-semibold transition focus:outline-none focus-visible:ring-4; }
      .btn-primary { @apply btn bg-indigo-600 text-white shadow-sm shadow-indigo-600/20 hover:bg-indigo-500 focus-visible:ring-indigo-200; }
      .btn-secondary { @apply btn bg-white text-slate-700 ring-1 ring-inset ring-slate-200 hover:bg-slate-50 focus-visible:ring-slate-200; }
      .eyebrow { @apply text-[11px] font-semibold uppercase tracking-[.08em] text-slate-400; }
    }
  </style>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <style>
    body { font-feature-settings: "cv11", "ss01"; }
    .tabular { font-variant-numeric: tabular-nums; }
    details > summary { list-style: none } details > summary::-webkit-details-marker { display: none }
    ::selection { background: #e0e7ff; }
  </style>
</head>
<body class="h-full bg-slate-50 font-sans text-slate-900 antialiased"
      hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  {% block body %}{% endblock %}
</body>
</html>
