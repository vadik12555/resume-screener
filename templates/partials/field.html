<div>
  <label for="{{ field.id_for_label }}" class="mb-1.5 block text-sm font-medium text-slate-700">{{ field.label }}</label>
  {{ field }}
  {% if field.errors %}<p class="mt-1.5 text-sm text-rose-600">{{ field.errors|join:" " }}</p>
  {% elif field.help_text %}<p class="mt-1.5 text-xs text-slate-400">{{ field.help_text|safe }}</p>{% endif %}
</div>
