{% if messages %}
<div class="mb-6 space-y-2">
  {% for m in messages %}
  <div class="flex items-center gap-3 rounded-xl border px-4 py-3 text-sm
    {% if m.tags == 'error' %}border-rose-200 bg-rose-50 text-rose-800{% else %}border-emerald-200 bg-emerald-50 text-emerald-800{% endif %}">
    {% if m.tags == 'error' %}⚠️{% else %}✅{% endif %} {{ m }}
  </div>
  {% endfor %}
</div>
{% endif %}
