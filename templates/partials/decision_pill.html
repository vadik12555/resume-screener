<span class="inline-flex items-center gap-1.5 rounded-full px-2 py-0.5 text-xs font-medium ring-1 ring-inset
  {% if c.decision == 'invited' %}bg-indigo-50 text-indigo-700 ring-indigo-200{% elif c.decision == 'rejected' %}bg-slate-50 text-slate-500 ring-slate-200{% else %}bg-white text-slate-600 ring-slate-200{% endif %}">
  <span class="h-1.5 w-1.5 rounded-full {% if c.decision == 'invited' %}bg-indigo-500{% elif c.decision == 'rejected' %}bg-slate-300{% else %}bg-sky-400{% endif %}"></span>
  {{ c.get_decision_display }}
</span>
