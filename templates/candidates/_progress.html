<div id="progress" {% if progress.active %}hx-get="{% url 'candidates_progress' vacancy.pk %}" hx-trigger="every 2s" hx-swap="outerHTML"{% endif %}>
{% if progress.active %}
  <div class="rounded-2xl border border-indigo-200 bg-gradient-to-r from-indigo-50 to-violet-50 p-5">
    <div class="flex items-center justify-between text-sm">
      <span class="flex items-center gap-2 font-semibold text-indigo-900">
        <svg class="h-4 w-4 animate-spin text-indigo-600" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"/></svg>
        ИИ анализирует резюме…
      </span>
      <span class="font-medium text-indigo-700">{{ progress.done }} из {{ progress.total }}</span>
    </div>
    <div class="mt-3 h-2 overflow-hidden rounded-full bg-white">
      <div class="h-full rounded-full bg-gradient-to-r from-indigo-500 to-violet-500 transition-all duration-700" style="width: {{ progress.percent }}%"></div>
    </div>
    <p class="mt-2 text-xs text-indigo-700/70">Локальная модель тратит ~20–60 с на резюме. Страницу можно закрыть — обработка продолжится.</p>
  </div>
{% endif %}
</div>
