<div id="decision" class="inline-flex rounded-xl bg-slate-100 p-1">
  {% for value, label in decisions %}
  <button hx-post="{% url 'candidate_decision' c.pk %}" hx-vals='{"decision": "{{ value }}"}'
          hx-target="#decision" hx-swap="outerHTML"
          class="rounded-lg px-4 py-2 text-sm font-medium transition
          {% if c.decision == value %}
            {% if value == 'invited' %}bg-indigo-600 text-white shadow{% elif value == 'rejected' %}bg-white text-rose-600 shadow{% else %}bg-white text-slate-900 shadow{% endif %}
          {% else %}text-slate-500 hover:text-slate-900{% endif %}">
    {% if value == 'invited' %}✓ {% elif value == 'rejected' %}✕ {% endif %}{{ label }}
  </button>
  {% endfor %}
</div>
